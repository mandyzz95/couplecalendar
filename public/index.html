<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我们的日历">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='32' r='16' fill='%23C99A9A'/%3E%3Ccircle cx='38' cy='32' r='16' fill='%238FA9B5' fill-opacity='.85'/%3E%3C/svg%3E">
<title>我们的日历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --a:#F6B8CF; --a-bg:#FDEAF1; --a-ink:#9B3E62;
  --b:#A9CBF2; --b-bg:#E6F1FD; --b-ink:#2F5E92;
  --both:#C6B4F0; --both-bg:#F0EAFD; --both-ink:#5B44A3;
  --accent:#B98B7B; --sage:#97AC92; --mine:#DCE5D3; --now:#A39A92; --danger:#B5665A;
  --lbbg:rgba(255,255,255,.85); --paper:#F7F3EE; --card:#FFFFFF; --line:#EFEAE4; --border:#E3DDD6; --soft:#FBF9F6; --soft2:#F3EEE8;
  --text:#4A4541; --text2:#6b635d; --muted:#A39A92;
  color-scheme:light;
  --hour:58px; --gutter:58px;
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei Light","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--text);
  font-family:var(--font);font-weight:300;letter-spacing:.04em;font-size:14px}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.serif{font-family:var(--font)}

/* ---------- header ---------- */
header{padding:16px 22px 10px}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px}
.title{font-family:var(--font);font-size:25px;font-weight:300;letter-spacing:.18em;white-space:nowrap}
.title{cursor:pointer;border-radius:10px;padding:2px 6px;margin-left:-6px;transition:background .15s}
.title:hover{background:var(--soft2)}
.title .amp{color:var(--accent);margin:0 .5em;font-weight:200}
#clock{font-family:var(--font);color:var(--muted);font-size:16px;white-space:nowrap;margin-left:6px}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 16px}
.btn:hover{background:var(--soft)}
.icon-btn{border:none;background:none;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--soft2)}
.range{font-family:var(--font);font-size:17px;white-space:nowrap;margin:0 4px}
.chip{border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--card);font-size:13px;white-space:nowrap}
.chip:hover{background:var(--soft)}
#people{display:none;gap:26px;margin-top:14px;flex-wrap:wrap;row-gap:10px}
.person{display:flex;align-items:center;gap:10px;min-width:190px;flex:1;max-width:320px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--card);font-size:14px;font-weight:400;flex:none;font-family:var(--font)}
.pinfo{flex:1;min-width:0}
.pname{display:flex;justify-content:space-between;font-size:13px;font-weight:400;margin-bottom:5px}
.pname small{color:var(--muted);font-weight:400}
.bar{height:5px;border-radius:5px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}

/* ---------- calendar ---------- */
#wrap{flex:1;min-height:0;margin:4px 16px 10px;background:var(--card);border-radius:20px;box-shadow:0 2px 14px rgba(120,100,80,.08);position:relative;overflow:hidden}
#scroller{position:absolute;inset:0;overflow:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--gutter);overscroll-behavior-x:contain}
.dayhead{scroll-snap-align:start}
#cal{display:grid;grid-template-columns:var(--gutter) repeat(7,minmax(112px,1fr));min-width:calc(var(--gutter) + 784px)}
.corner{position:sticky;top:0;left:0;z-index:7;background:var(--card);border-bottom:1px solid var(--line)}
.dayhead{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);text-align:left;padding:14px 10px 8px}
.dhrow{display:flex;align-items:center;gap:6px;font-family:var(--font)}
.dow{font-size:15px;letter-spacing:.12em;color:var(--text);font-weight:600}
.dnum{font-size:17px;color:var(--text2);min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%}
.today .dnum{background:var(--accent);color:var(--card);font-size:14px}
.today .dow{color:var(--text);font-weight:600}
.sub{display:flex;font-size:13px;margin-top:6px;font-weight:500}
.sub div{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub div:first-child{color:color-mix(in srgb,var(--a) 55%,var(--a-ink))}
.sub div:last-child{color:color-mix(in srgb,var(--b) 55%,var(--b-ink));padding-left:4px}
.gutter{position:sticky;left:0;z-index:5;background:var(--card)}
.hourlabel{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding-right:10px;position:relative;top:-7px;font-family:var(--font)}
.daycol{position:relative;border-left:1px solid var(--line);height:calc(var(--hour) * 24);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour));cursor:pointer}
.daycol .mid{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line);pointer-events:none}
.ev{position:absolute;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;
  border:1.5px solid var(--card);transition:transform .12s, box-shadow .12s}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(100,80,60,.12)}
.ev .t{font-weight:400;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.ev .tm{opacity:.75;font-size:11px;white-space:nowrap}
.ev .av{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;color:var(--card);font-size:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.ev.short{display:flex;gap:5px;align-items:center;padding-top:2px}
.ev.short .av{top:50%;transform:translateY(-50%)}
.ev.a{background:var(--a-bg);color:var(--a-ink);z-index:2}.ev.a .av{background:var(--a)}
.ev.b{background:var(--b-bg);color:var(--b-ink);z-index:2}.ev.b .av{background:var(--b)}
.ev.both{background:var(--both-bg);color:var(--both-ink);z-index:1}.ev.both .av{background:var(--both)}
.ev.fresh{animation:pop 1s ease}
@keyframes pop{0%{transform:scale(.9);box-shadow:0 0 0 5px rgba(185,139,123,.35)}100%{transform:scale(1)}}
.pt{position:absolute;height:0;z-index:3;cursor:pointer}
.pt .ln{position:absolute;left:0;right:0;top:-1px;height:2px;border-radius:2px;background:var(--pc)}
.pt .dot{position:absolute;left:-1px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--pc);border:2px solid var(--card)}
.pt .lb{position:absolute;left:8px;bottom:3px;font-size:11px;color:var(--pi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 14px);font-weight:500;letter-spacing:.06em;background:var(--lbbg);padding:0 4px;border-radius:4px}
.pt:hover .ln{height:3px}
.pt.a{--pc:var(--a);--pi:var(--a-ink)}.pt.b{--pc:var(--b);--pi:var(--b-ink)}.pt.both{--pc:var(--both);--pi:color-mix(in srgb,var(--both) 55%,var(--text))}
.ptcheck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin:-2px 0 12px;cursor:pointer}
.ptcheck input{accent-color:var(--accent);width:16px;height:16px}
.ev,.pt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ev{cursor:grab}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.ev .rz::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .15s}
.ev:hover .rz::after,.ev.dragging .rz::after{opacity:.35}
.ev.dragging,.pt.dragging{z-index:30 !important;box-shadow:0 8px 22px rgba(90,70,50,.25);cursor:grabbing;opacity:.92;transition:none}
.ev.dragging{transform:scale(1.02)}
.pt.dragging .ln{height:3px}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
#fab{position:absolute;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;border:none;background:var(--both);color:var(--card);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(110,90,140,.35);z-index:8}
#fab:hover{filter:brightness(1.05)}

/* ---------- event popover (single click) ---------- */
#pop{position:fixed;z-index:40;width:340px;max-width:calc(100vw - 24px);background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(80,60,40,.22),0 2px 6px rgba(80,60,40,.08);padding:10px 18px 18px;display:none}
#pop{transform-origin:var(--ox,0) var(--oy,0)}
#pop.show{display:block;animation:popIn .26s cubic-bezier(.2,.9,.25,1.15)}
#pop.closing{display:block;animation:popOut .16s ease-in forwards}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.85)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(110%)}}
.heart{display:inline-block;color:var(--both)}
.heart.beat{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.28);opacity:1}}
.pop-bar{display:flex;justify-content:flex-end;gap:2px;margin:0 -8px 2px 0}
.pop-bar button{width:36px;height:36px;border:none;background:none;border-radius:50%;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.pop-bar button:hover{background:var(--soft2)}
.pop-row{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.pop-ic{width:22px;flex:none;display:flex;justify-content:center;color:var(--muted);padding-top:2px}
.pop-sq{width:16px;height:16px;border-radius:5px;margin-top:7px}
.pop-title{font-size:20px;font-weight:500;line-height:1.35;word-break:break-word;letter-spacing:.04em}
.pop-sub{color:var(--text2);font-size:14px;margin-top:3px;line-height:1.5}
.pop-people{display:flex;flex-direction:column;gap:6px}
.pop-person{display:flex;align-items:center;gap:8px;font-size:14px}
.pop-person .avatar{width:26px;height:26px;font-size:12px}
.pop-confirm{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:none}
.pop-confirm.show{display:block}
.pop-confirm .q{font-size:14px;margin-bottom:10px}
.pop-confirm .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ev .loc{font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){
  #pop{left:8px !important;right:8px;top:auto !important;bottom:8px;width:auto;max-width:none;border-radius:20px;padding-bottom:22px}
}

/* ---------- palette (themes) ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.theme{border:2px solid var(--border);border-radius:14px;padding:10px;background:var(--tp);cursor:pointer;text-align:left;color:var(--tt)}
.theme.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.theme .nm{font-size:13px;font-weight:500;margin-bottom:8px}
.theme .mini{display:flex;gap:4px;height:34px}
.theme .mini i{flex:1;border-radius:6px}
.seg{display:flex;background:var(--soft2);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:7px 4px;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.theme .mini i.blank{background:#fff;border:1px solid var(--border);border-left:3px solid var(--muted)}
.custom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.field .custom label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;margin:0}
.custom input[type=color]{width:42px;height:42px;border:2px solid var(--border);border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
.custom input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.custom input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.custom input[type=color]::-moz-color-swatch{border:none;border-radius:50%}

/* ---------- touch feedback ---------- */
.btn,.icon-btn,.chip,#send,#fab,#toggleChat,#micBtn,.theme,.whopick button,.bigpick button,.seg button,.pop-bar button,.hints button{transition:transform .14s ease,background-color .18s ease,box-shadow .18s ease,border-color .18s ease}
.btn:active,.icon-btn:active,.chip:active,#send:active,#toggleChat:active,#micBtn:active,.theme:active,.whopick button:active,.bigpick button:active,.seg button:active,.pop-bar button:active{transform:scale(.93)}
#fab{transition:transform .25s cubic-bezier(.2,.9,.25,1.3),box-shadow .2s}
#fab:hover{transform:rotate(90deg) scale(1.05)}
#fab:active{transform:rotate(90deg) scale(.92)}
#prevBtn:hover{transform:translateX(-2px)} #nextBtn:hover{transform:translateX(2px)}
.theme:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,50,70,.08)}
#meChip.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
/* events: arrive, leave, snap, synced */
.ev.fresh,.pt.fresh{animation:dropIn .6s cubic-bezier(.2,.9,.25,1.2)}
@keyframes dropIn{0%{transform:translateY(-18px) scale(.9);opacity:0}60%{opacity:1}100%{transform:none}}
.ev.fresh::after,.ev.synced::after{content:"";position:absolute;inset:-2px;border-radius:12px;box-shadow:0 0 0 3px var(--accent);opacity:0;animation:ring 1.4s ease .3s 1;pointer-events:none}
.ev.synced::after{box-shadow:0 0 0 3px var(--both);animation-delay:0s;animation-iteration-count:2}
@keyframes ring{0%{opacity:0}25%{opacity:.55}100%{opacity:0}}
.ev.leaving,.pt.leaving{animation:leave .22s ease-in forwards;pointer-events:none}
@keyframes leave{to{transform:scale(.7);opacity:0}}
.ev.snap{animation:snap .35s cubic-bezier(.2,.9,.25,1.4)}
@keyframes snap{0%{transform:scale(1.04)}100%{transform:none}}
.drag-ghost{position:absolute;border:1.5px dashed var(--muted);border-radius:10px;background:transparent;opacity:.6;pointer-events:none;z-index:1}
.ghost-new{position:absolute;border:1.5px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);pointer-events:none;z-index:3;animation:ghostIn .2s ease}
.ghost-new.out{animation:ghostOut .2s ease forwards}
@keyframes ghostIn{from{opacity:0;transform:scale(.95)}}
@keyframes ghostOut{to{opacity:0}}
/* loading skeleton */
.skel.out{opacity:0;transition:opacity .25s ease}
.ev.appear,.pt.appear{animation:appear .5s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.skel{position:absolute;border-radius:10px;background:linear-gradient(90deg,var(--soft2) 25%,var(--line) 45%,var(--soft2) 65%);background-size:300% 100%;animation:shimmer 1.4s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
/* chat: bubbles pop in, typing dots */
.msg.new .bubble{animation:bubbleL .32s cubic-bezier(.2,.9,.25,1.2) both;transform-origin:left bottom}
.msg.mine.new .bubble{animation-name:bubbleR;transform-origin:right bottom}
@keyframes bubbleL{from{opacity:0;transform:translateX(-10px) scale(.85)}}
@keyframes bubbleR{from{opacity:0;transform:translateX(10px) scale(.85)}}
.dots{display:inline-flex;gap:4px;padding:3px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
#send.sent{animation:sent .45s ease}
@keyframes sent{0%{transform:scale(1)}30%{transform:scale(.88)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* ---------- chat dock ---------- */
#dock{max-height:30vh;max-height:30dvh;display:flex;flex-direction:column;flex:none;margin:0 16px 14px;background:var(--card);border-radius:20px;box-shadow:0 2px 14px rgba(120,100,80,.08);overflow:hidden}
#msgs{max-height:0;overflow:auto;transition:max-height .35s cubic-bezier(.2,.9,.25,1),padding .35s ease;padding:0 16px;background:var(--soft)}
#dock.open #msgs{max-height:calc(30vh - 64px);max-height:calc(30dvh - 64px);flex:1;min-height:0;padding:12px 16px 6px}
.inputrow{flex:none}
#micBtn{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:var(--soft2);color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
#micBtn:hover{background:var(--soft2)}
#micBtn.on{background:var(--accent);color:var(--card);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,139,122,.45)}50%{box-shadow:0 0 0 8px rgba(201,139,122,0)}}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:8px 0}
.msg.mine{align-items:flex-end}
.msg .who{font-size:11px;color:var(--muted);margin:0 4px 3px}
.bubble{max-width:78%;padding:9px 13px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-word;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.mine .bubble{background:var(--mine);border-bottom-right-radius:4px}
.msg.agent .bubble,.msg.other .bubble{border-bottom-left-radius:4px}
.msg.other .bubble{background:var(--ob)}
.typing .bubble{color:var(--muted)}
.hints{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.hints:empty{display:none}
.hints button{border:1px solid var(--border);background:var(--soft);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--text2)}
.hints button:hover{background:var(--soft2)}
.inputrow{display:flex;gap:8px;padding:10px 12px;align-items:flex-end}
#toggleChat{border:none;background:var(--soft2);border-radius:999px;height:40px;padding:0 14px;font-size:12px;color:var(--text2);white-space:nowrap}
#input{font-weight:300;letter-spacing:.04em;flex:1;resize:none;border:1px solid var(--border);border-radius:20px;padding:9px 16px;font:inherit;line-height:20px;height:40px;max-height:120px;background:var(--soft);outline:none;color:var(--text)}
#input:focus{border-color:var(--sage);background:var(--card)}
#send{background:var(--sage);color:var(--card);border:none;border-radius:999px;height:40px;padding:0 20px;font-weight:400}
#send:disabled{opacity:.45;cursor:default}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,36,46,0);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  visibility:hidden;pointer-events:none;transition:background-color .25s ease,backdrop-filter .25s ease,visibility 0s linear .28s}
.overlay.show{visibility:visible;pointer-events:auto;background:rgba(40,36,46,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:background-color .25s ease,backdrop-filter .25s ease}
.modal{background:var(--card);border-radius:20px;padding:22px 22px 18px;width:min(400px,100%);box-shadow:0 16px 48px rgba(80,60,40,.18);
  transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.55);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1.12),opacity .2s ease}
.overlay.show .modal{transform:none;opacity:1}
.overlay.closing .modal{transition:transform .2s ease-in,opacity .18s ease-in}
.modal h3{margin:0 0 16px;font-weight:400;font-size:19px;font-family:var(--font)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font:inherit;background:var(--soft);color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--card)}
.row{display:flex;gap:10px}.row .field{flex:1}
.whopick{display:flex;gap:8px}
.whopick button{flex:1;border:2px solid var(--border);background:var(--card);border-radius:12px;padding:9px 4px;font-size:13px}
.whopick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));font-weight:400}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.96);background:var(--accent)}
.btn.danger{color:var(--danger);margin-right:auto}
.btn.danger.confirm{background:var(--danger);color:var(--card);border-color:var(--danger)}
.bigpick{display:flex;gap:12px;margin-top:6px}
.bigpick button{flex:1;padding:20px 8px;border-radius:16px;border:none;color:var(--card);font-size:18px;font-weight:400;font-family:var(--font)}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}

#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,16px) scale(.96);background:var(--text);color:var(--card);padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.25,1.2);max-width:90vw;display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast svg{flex:none}
#toast svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:tick .4s ease .15s forwards}
@keyframes tick{to{stroke-dashoffset:0}}

.break{display:none}
/* day / night button: sun and moon share one orbit; turning it sets one and raises the other */
#modeBtn .sky{position:relative;width:24px;height:24px;overflow:hidden;display:block;border-radius:6px}
#modeBtn .orbit{position:absolute;inset:0;transform-origin:50% 140%;transition:transform .9s cubic-bezier(.55,0,.25,1)}
#modeBtn .orbit.instant{transition:none}
#modeBtn .sun,#modeBtn .moon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:50% 140%}
#modeBtn .moon{transform:rotate(180deg)}
#modeBtn .sun svg{color:color-mix(in srgb,var(--a) 70%,var(--a-ink))}
#modeBtn .moon svg{color:var(--both)}
/* smooth day <-> night: the whole page cross-fades as one picture */
html.vt-theme::view-transition-old(root){animation:none;mix-blend-mode:normal}
html.vt-theme::view-transition-new(root){animation:vtFadeIn .8s ease-in-out both;mix-blend-mode:normal}
@keyframes vtFadeIn{from{opacity:0}to{opacity:1}}
#modeBtn{view-transition-name:modebtn}
::view-transition-old(modebtn){display:none}
::view-transition-new(modebtn){animation:none}
/* fallback for browsers without view transitions */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after{
  transition:background-color .8s ease,color .8s ease,border-color .8s ease,box-shadow .8s ease,fill .8s ease,stroke .8s ease !important}
html.theme-anim #modeBtn .orbit{transition:transform .9s cubic-bezier(.55,0,.25,1) !important}
.zoom{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--card);overflow:hidden}
.zoom .icon-btn{border-radius:0;width:34px;height:30px;font-size:18px}
#scroller{touch-action:pan-x pan-y}
@media (max-width:1200px){ #clock{display:none} }
@media (max-width:700px){
  .overlay{align-items:flex-end;padding:0}
  .modal{width:100% !important;border-radius:22px 22px 0 0;padding-top:26px;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
    transform:translateY(100%);opacity:1;transition:transform .34s cubic-bezier(.2,.9,.25,1)}
  .modal::before{content:"";position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--border)}
  .modal{position:relative}
  .overlay.show .modal{transform:translateY(var(--drag,0px))}
  .overlay.dragging .modal{transition:none}
  #whoOverlay{align-items:center;padding:20px}
  #whoOverlay .modal{border-radius:22px;padding:22px 22px 20px;transform:scale(.7);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1.12),opacity .2s ease}
  #whoOverlay .modal::before{display:none}
  #whoOverlay.show .modal{transform:none;opacity:1}
  #pop.show{animation:sheetUp .32s cubic-bezier(.2,.9,.25,1)}
  #pop.closing{animation:sheetDown .2s ease-in forwards}
  :root{--hour:54px;--gutter:42px}
  header{padding:12px 14px 6px}
  .toprow{gap:4px;row-gap:6px}
  .title{font-size:19px;letter-spacing:.1em;order:0}
  .title .amp{margin:0 .3em}
  #clock{display:none}
  .spacer{order:0}
  #meChip,#modeBtn,#paletteBtn,#settingsBtn{order:1}
  .break{display:block;order:2;flex-basis:100%;height:0}
  #todayBtn,#prevBtn,#nextBtn,.range{order:3}
  .zoom{order:4;margin-left:auto}
  #todayBtn{padding:4px 14px;font-size:13px}
  .range{font-size:15px;margin-left:6px}
  #wrap{margin:4px 8px 8px;border-radius:16px}
  #cal{min-width:0 !important}
  .dayhead{padding:10px 4px 6px;text-align:center}
  .dhrow{justify-content:center;gap:4px}
  .dow{font-size:13px;letter-spacing:.04em}
  .dnum{font-size:15px;min-width:24px;height:24px;line-height:24px}
  .today .dnum{font-size:13px}
  .sub{font-size:13px;text-align:center}
  .sub div:last-child{padding-left:0}
  .hourlabel{font-size:10px;padding-right:6px}
  .ev{padding:4px 5px;border-radius:8px}
  .ev .av{display:none}
  .ev .t{padding-right:0;white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:12px;letter-spacing:.02em}
  .ev .tm{font-size:10px;letter-spacing:0;white-space:normal}
  .ev.short .tm{display:none}
  .ev.short .t{-webkit-line-clamp:1;word-break:normal;white-space:nowrap;text-overflow:ellipsis;display:block}
  .pt .lb{font-size:11px;letter-spacing:.02em;left:4px;padding:1px 3px;white-space:normal;line-height:1.15;max-width:calc(100% - 4px);word-break:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #fab{width:48px;height:48px;right:14px;bottom:14px}
  #dock{margin:0 8px 8px;border-radius:18px}
  .hints{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hints button{white-space:nowrap;flex:none}
  #input{font-size:16px}
  #toggleChat{padding:0 10px}
}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <div class="title" id="title"></div>
    <div id="clock"></div>
    <div class="spacer"></div>
    <button class="btn" id="todayBtn">今天</button>
    <button class="icon-btn" id="prevBtn" title="上一周">‹</button>
    <button class="icon-btn" id="nextBtn" title="下一周">›</button>
    <div class="break"></div>
    <div class="range" id="range"></div>
    <div class="zoom"><button class="icon-btn" id="zoomOut" title="缩小">−</button><button class="icon-btn" id="zoomIn" title="放大">+</button></div>
    <button class="chip" id="meChip"></button>
    <button class="icon-btn" id="modeBtn" title="白天 / 夜间"><span class="sky"><span class="orbit" id="orbit"><span class="sun"></span><span class="moon"></span></span></span></button>
    <button class="icon-btn" id="paletteBtn" title="配色"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8.1-9-8.1z"/><circle cx="7.5" cy="11.5" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.8" r="1.2" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
  </div>
</header>

<main id="wrap"><div id="scroller"><div id="cal"></div></div><button id="fab" title="新日程">+</button></main>

<div id="dock">
  <div id="msgs"></div>
  <div class="inputrow">
    <button id="toggleChat">聊天 ▴</button>
    <button id="micBtn" title="按一下开始说话，再按一下停止" style="display:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <textarea id="input" rows="1" placeholder="今天有什么新的安排"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<!-- event editor -->
<div class="overlay" id="evOverlay">
  <div class="modal">
    <h3 id="evTitle">新日程</h3>
    <div class="field"><label>做什么</label><input id="fTitle" placeholder="比如：普拉提"></div>
    <div class="field"><label>地点（选填）</label><input id="fLoc" maxlength="80" placeholder="比如：UCLA 图书馆"></div>
    <div class="field"><label>日期</label><input id="fDate" type="date"></div>
    <div class="row">
      <div class="field"><label>开始</label><input id="fStart" type="time" step="300"></div>
      <div class="field" id="endField"><label>结束</label><input id="fEnd" type="time" step="300"></div>
    </div>
    <label class="ptcheck"><input type="checkbox" id="fPoint"> 只是一个时间点（显示成一条线，比如起床、出发）</label>
    <div class="field"><label>谁</label><div class="whopick" id="fWho"></div></div>
    <div class="actions">
      <button class="btn danger" id="delBtn">删除</button>
      <button class="btn danger confirm" id="delSeriesBtn" style="display:none;margin-right:0">删除全部重复</button>
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- event popover -->
<div id="pop" role="dialog" aria-label="日程详情">
  <div class="pop-bar">
    <button id="popEdit" title="编辑"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>
    <button id="popDel" title="删除"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="popClose" title="关闭"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pop-row"><div class="pop-ic"><div class="pop-sq" id="popSq"></div></div>
    <div style="min-width:0"><div class="pop-title" id="popTitle"></div><div class="pop-sub" id="popWhen"></div></div></div>
  <div class="pop-row" id="popLocRow"><div class="pop-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <div class="pop-sub" id="popLoc" style="margin-top:0;color:var(--text)"></div></div>
  <div class="pop-row"><div class="pop-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg></div>
    <div class="pop-people" id="popWho"></div></div>
  <div class="pop-confirm" id="popConfirm">
    <div class="q" id="popQ">删除这个日程？</div>
    <div class="btns" id="popBtns"></div>
  </div>
</div>

<!-- palette -->
<div class="overlay" id="palOverlay">
  <div class="modal" style="width:min(520px,100%)">
    <h3>配色</h3>
    <div class="field"><label>白天 / 夜间</label>
      <div class="seg" id="modeSeg"><button type="button" data-m="light">☀︎ 白天</button><button type="button" data-m="dark">☾ 夜间</button></div>
    </div>
    <div class="field"><label>预设</label><div class="themes" id="themeList"></div></div>
    <div class="field" style="margin-top:14px" id="customField"><label>自行定义</label>
      <div class="custom">
        <label><input type="color" id="cA">瑄</label>
        <label><input type="color" id="cB">瀚</label>
        <label><input type="color" id="cBoth">一起</label>
        <label><input type="color" id="cPaper">背景</label>
      </div>
    </div>
    <div class="actions"><button class="btn primary" id="palDone">好了</button></div>
  </div>
</div>

<!-- settings -->
<div class="overlay" id="setOverlay">
  <div class="modal">
    <h3>改名字 / 分享</h3>
    <div class="row">
      <div class="field"><label>左边</label><input id="nA" maxlength="12"></div>
      <div class="field"><label>右边</label><input id="nB" maxlength="12"></div>
    </div>
    <div class="field"><label>发给 TA 的专属链接</label>
      <div style="display:flex;gap:8px"><input id="shareLink" readonly><button class="btn" id="copyLink" type="button" style="white-space:nowrap;flex:none">复制</button></div>
    </div>
    <div class="field"><label>备份 / 搬家</label>
      <div style="display:flex;gap:8px">
        <button class="btn" id="exportBtn" type="button" style="flex:1">导出日程</button>
        <button class="btn" id="importBtn" type="button" style="flex:1">导入日程</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      </div>
    </div>
    <div class="note">拿到这个链接的人都能看和编辑这本日历，只发给 TA，别发到公开的地方哦。<br>名字两个人共用；“我是谁”只记在这台设备上，各自选一次就好。</div>
    <div class="actions">
      <button class="btn" id="setCancel">取消</button>
      <button class="btn primary" id="setSave">保存</button>
    </div>
  </div>
</div>

<!-- who am I -->
<div class="overlay" id="whoOverlay">
  <div class="modal">
    <h3>你是谁呀？</h3>
    <div class="bigpick" id="whoBtns"></div>
    <div class="note">选好之后，你说“我”的时候助手就知道是你啦。在这台设备上只用选一次，之后点右上角可以改。</div>
  </div>
</div>

<!-- first visit: create a calendar -->
<div class="overlay" id="newOverlay">
  <div class="modal">
    <h3>创建你们的日历 ♥</h3>
    <div class="row">
      <div class="field"><label>你的名字</label><input id="newA" maxlength="12" placeholder="比如：小瑄"></div>
      <div class="field"><label>TA 的名字</label><input id="newB" maxlength="12" placeholder="比如：小瀚"></div>
    </div>
    <div class="actions"><button class="btn primary" id="newGo" style="width:100%">创建</button></div>
    <div class="note">创建好以后，在右上角 ⚙ 里复制专属链接发给 TA，两个人就能一起用啦。</div>
    <div class="field" style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><label>已经有日历了？粘贴专属链接进入</label>
      <div style="display:flex;gap:8px"><input id="openLink" placeholder="https://…/?c=…"><button class="btn" id="openGo" type="button">进入</button></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= helpers ================= */
let lastPointer = null;
document.addEventListener('pointerdown', e => { lastPointer = { x: e.clientX, y: e.clientY }; }, true);
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const DOW = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const dowOf = s => DOW[(parseYmd(s).getDay() + 6) % 7];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const COLORS = { a: 'var(--a)', b: 'var(--b)', both: 'var(--both)' };
const normTime = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim()); if (!m) return null; const h = +m[1], mi = +m[2]; if (h > 24 || mi > 59) return null; return `${pad(Math.min(h, 24))}:${pad(mi)}`; };

function showOv(id) {
  const ov = document.getElementById(id), m = ov.querySelector('.modal');
  ov.classList.remove('closing'); m.style.removeProperty('--drag');
  if (window.innerWidth > 700 && lastPointer) {
    const w = m.offsetWidth, h = m.offsetHeight;
    const left = (window.innerWidth - w) / 2, top = (window.innerHeight - h) / 2;
    m.style.setProperty('--ox', (lastPointer.x - left) + 'px'); m.style.setProperty('--oy', (lastPointer.y - top) + 'px');
  } else { m.style.setProperty('--ox', '50%'); m.style.setProperty('--oy', '50%'); }
  requestAnimationFrame(() => ov.classList.add('show'));
}
function hideOv(id) {
  const ov = document.getElementById(id); if (!ov.classList.contains('show')) return;
  ov.classList.add('closing'); ov.classList.remove('show');
  setTimeout(() => ov.classList.remove('closing'), 260);
}
// phones: drag a sheet down to close it
function sheetSwipe(id, onClose) {
  const ov = document.getElementById(id), m = ov.querySelector('.modal'); let y0 = null, dy = 0;
  m.addEventListener('touchstart', e => { if (window.innerWidth > 700 || m.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  m.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 4) { ov.classList.add('dragging'); m.style.setProperty('--drag', dy + 'px'); } }, { passive: true });
  m.addEventListener('touchend', () => { if (y0 === null) return; ov.classList.remove('dragging'); m.style.removeProperty('--drag'); if (dy > 90) onClose(); y0 = null; });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'), good = /^(已|导入了|整个|链接已|创建好)/.test(msg);
  t.innerHTML = (good ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '<span></span>';
  t.querySelector('span').textContent = msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ================= which calendar ================= */
const CAL = (() => {
  const q = new URLSearchParams(location.search).get('c');
  const ok = s => /^[A-Za-z0-9_-]{16,48}$/.test(s || '');
  if (ok(q)) { ls.set('cc_last', q); return q; }
  const last = ls.get('cc_last');
  if (ok(last)) { try { history.replaceState(null, '', '?c=' + last); } catch (e) {} return last; }
  return null;
})();
const ME_KEY = 'cc_me_' + CAL;

/* ================= state ================= */
const state = {
  events: [],
  names: { a: '她', b: '他' },
  me: ['a', 'b'].includes(ls.get(ME_KEY)) ? ls.get(ME_KEY) : null,
  weekStart: mondayOf(new Date()), // = view start date
  chat: [],
  freshIds: new Set(),
  loading: true,
};
let assistantOn = false, pendingWrites = 0, busy = false, firstRender = true, programmatic = false, colW = 110;
const diffDays = (a, b) => Math.round((new Date(a.getFullYear(), a.getMonth(), a.getDate()) - new Date(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000);
const range = { start: null, days: 70 };
const whoLabel = w => w === 'both' ? '一起' : (state.names[w] || w);
const initial = w => w === 'both' ? '♥' : String(state.names[w] || '?').slice(-1);
function renderPeople(mins) {
  const max = Math.max(60, mins.a, mins.b, mins.both);
  $('#people').innerHTML = ['a', 'b', 'both'].map(w => {
    const h = +(mins[w] / 60).toFixed(1);
    const label = w === 'both' ? '一起' : esc(state.names[w]);
    return `<div class="person"><div class="avatar" style="background:${COLORS[w]}">${esc(initial(w))}</div>
      <div class="pinfo"><div class="pname"><span>${label}</span><small>本周 ${h} 小时${w === 'both' && h ? ' ♥' : ''}</small></div>

async function api(path, method = 'GET', data) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (data) opt.body = JSON.stringify(data);
  const r = await fetch('/api/' + path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('网络错误 ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function write(fn) { pendingWrites++; try { return await fn(); } finally { pendingWrites--; } }
async function addEvents(list) {
  const payload = list.map(e => ({ date: e.date, start: e.start, end: e.end, title: e.title, who: e.who, kind: e.kind || 'range', location: e.location || '', seriesId: e.seriesId, by: state.me || '' }));
  const j = await write(() => api('events', 'POST', { c: CAL, events: payload }));
  state.events.push(...j.events); render();
  return j.events.map(e => e.id);
}
async function addEvent(ev) { return (await addEvents([ev]))[0]; }
async function updateEvent(id, fields) {
  const e = state.events.find(x => x.id === id); if (e) Object.assign(e, fields); render();
  await write(() => api('events', 'PATCH', { c: CAL, id, fields }));
}
function leaveAnim(sel) { const ns = document.querySelectorAll(sel); ns.forEach(n => n.classList.add('leaving')); return new Promise(r => setTimeout(r, ns.length ? 200 : 0)); }

  await write(() => api('events', 'DELETE', { c: CAL, id }));
}

  state.events = state.events.filter(x => x.seriesId !== seriesId); render();
  await write(() => api('events', 'DELETE', { c: CAL, seriesId }));
}

// keep both phones in sync: re-read every few seconds and whenever the page comes back
let lastChatSig = '';
let snapIds = new Set(), syncIds = new Set(), firstAppear = false;
async function refresh() {
  if (!CAL || pendingWrites || busy || (drag && drag.active)) return;
  try {
    const [e, m] = await Promise.all([api('events?c=' + CAL), api('messages?c=' + CAL)]);
    if (pendingWrites || busy) return;
    const es = JSON.stringify(e.events), ms = JSON.stringify(m.messages.map(x => x.id));
    if (es !== JSON.stringify(state.events)) {
      if (!state.loading) {
        const before = new Map(state.events.map(x => [x.id, JSON.stringify(x)]));
        e.events.forEach(x => { if (before.get(x.id) !== JSON.stringify(x)) syncIds.add(x.id); });
        setTimeout(() => syncIds.clear(), 3000);

      state.events = e.events; render();
    }
    if (ms !== lastChatSig) { lastChatSig = ms; state.chat = m.messages; renderChat(); }
  } catch (err) { /* offline for a moment: try again next time */ }
}

function layoutLanes(list) {
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    cluster.forEach(e => { let i = lanes.findIndex(end => end <= e.s); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = e.e; e.lane = i; });
    cluster.forEach(e => e.lanes = lanes.length);
    out.push(...cluster); cluster = []; clusterEnd = -1;
  };
  list.sort((x, y) => x.s - y.s || y.e - x.e).forEach(e => {
    if (cluster.length && e.s >= clusterEnd) flush();
    cluster.push(e); clusterEnd = Math.max(clusterEnd, e.e);
  });
  if (cluster.length) flush();
  return out;
}

const shortT = t => { const [h, m] = String(t).split(':'); return +m ? `${+h}:${m}` : `${+h}`; };
function numDays() { const w = window.innerWidth; return w >= 760 ? 7 : w >= 560 ? 5 : w >= 330 ? 3 : 2; }
function startFor(d) { if (numDays() === 7) return mondayOf(d); const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return x; }
function setWeek(d) { scrollToDate(startFor(d)); }
function scrollToDate(d, smooth = true) {
  const idx = diffDays(d, range.start), N = numDays();
  const far = Math.abs(diffDays(d, state.weekStart)) > N;
  if (far || !smooth || idx < 3 || idx + N > range.days - 3) { clearTimeout(extendTimer); state.weekStart = d; render(); return; }
  smoothUntil = Date.now() + 700;

  $('#range').textContent = ws.getMonth() === we.getMonth()

let hsRaf = 0, extendTimer = 0, smoothUntil = 0;
$('#scroller').addEventListener('scroll', () => {
  if (programmatic || hsRaf) return;
  hsRaf = requestAnimationFrame(() => {
    hsRaf = 0;
    const sc = $('#scroller'), N = numDays();
    const idx = Math.round(sc.scrollLeft / colW);
    const ns = addDays(range.start, idx);
    if (ymd(ns) !== ymd(state.weekStart)) { state.weekStart = ns; updateRangeLabel(); }
    // near an edge: extend once scrolling settles
    if (idx < 7 || idx + N > range.days - 7) {
      clearTimeout(extendTimer);
      extendTimer = setTimeout(function ext() {
        if (Date.now() < smoothUntil) { extendTimer = setTimeout(ext, 200); return; }
        const i2 = Math.round($('#scroller').scrollLeft / colW);
        state.weekStart = addDays(range.start, i2);
        if (i2 < 7) { range.start = addDays(range.start, -28); range.days += 28; }
        else if (i2 + numDays() > range.days - 7) { range.days += 28; }
        if (range.days > 126) { // trim the far side
          const cur = diffDays(state.weekStart, range.start);
          if (cur > range.days / 2) { range.start = addDays(range.start, 28); }
          range.days -= 28;
        }
        render();
      }, 160);
    }
  });
}, { passive: true });

        if (a.kind === 'point' || a.kind === 'range') f.kind = a.kind;
        if (f.kind === 'point' && f.start) f.end = f.start;
        if (Object.keys(f).length) { await updateEvent(a.id, f); state.freshIds.add(a.id); firstDate = firstDate || f.date || state.events.find(e => e.id === a.id)?.date; }
      } else if (a.op === 'delete_series' && a.series) {
        const list = state.events.filter(e => e.seriesId === a.series);
        firstDate = firstDate || list[0]?.date;
        if (list.length) await deleteSeries(a.series);
      } else if (a.op === 'delete' && a.id && state.events.some(e => e.id === a.id)) {
        firstDate = firstDate || state.events.find(e => e.id === a.id)?.date;
        await deleteEvent(a.id);
      }
    } catch (err) { fails++; }
  }
  if (firstDate) { const fd = parseYmd(firstDate); if (fd < state.weekStart || fd >= addDays(state.weekStart, numDays())) setWeek(fd); else render(); }
  setTimeout(() => {                       // bring the new event into view
    const n = document.querySelector('.ev.fresh, .pt.fresh'), sc = $('#scroller');
    if (n) sc.scrollTo({ top: Math.max(0, n.offsetTop - sc.clientHeight / 3), behavior: 'smooth' });
  }, 350);
  setTimeout(() => state.freshIds.clear(), 1500);
  return fails;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy || !assistantOn) return;
  if (!state.me) { openWho(); return; }
  busy = true; $('#send').disabled = true;
  input.value = ''; autosize(); openDock(true);
  const mine = { role: 'user', from: state.me, text, ts: Date.now() };
  state.chat.push(mine); renderChat(true);
  const sb = $('#send'); sb.classList.remove('sent'); void sb.offsetWidth; sb.classList.add('sent');
  try {
    const n = new Date();
    const res = await api('assistant', 'POST', { c: CAL, text, me: state.me, today: ymd(n), time: `${pad(n.getHours())}:${pad(n.getMinutes())}` });
    state.chat.pop();
    try { await addChat(mine); } catch (e) {}
    const fails = await applyActions(res.actions);
    let reply = String(res.reply || '好哒，记下啦～');
    if (fails) reply += `\n（有 ${fails} 条没记成功，可以再说一次～）`;
    await addChat({ role: 'agent', text: reply, ts: Date.now() + 1 });
  } catch (e) {
    if (state.chat[state.chat.length - 1] === mine) { state.chat.pop(); try { await addChat(mine); } catch (e2) {} }
    toast('小助手出了点问题：' + (e && e.message || e));
  } finally {
    busy = false; $('#send').disabled = false; renderChat();
  }
}

/* ================= drag to move / resize ================= */
let drag = null, justDragged = false;
function colAt(x) {
  for (const c of document.querySelectorAll('.daycol')) { const r = c.getBoundingClientRect(); if (x >= r.left && x < r.right) return c; }
  return null;
}
function attachDrag(node, ev, isPoint) {
  node.addEventListener('pointerdown', pe => {
    if (pe.button !== 0 || drag) return;
    const mode = pe.target.classList.contains('rz') ? 'resize' : 'move';
    const s0 = toMin(ev.start), e0 = isPoint ? s0 : Math.max(toMin(ev.end), s0 + 15);
    drag = { node, ev, isPoint, mode, s0, e0, x0: pe.clientX, y0: pe.clientY, touch: pe.pointerType !== 'mouse', active: false, date: ev.date, s: s0, e: e0, id: pe.pointerId };
    if (drag.touch) drag.timer = setTimeout(() => activateDrag(), 380);
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragCancel);
  });
}
function activateDrag() {
  if (!drag || drag.active) return;
  drag.active = true; drag.node.classList.add('dragging');
  const g = el('div', 'drag-ghost'); g.style.cssText = `top:${drag.node.style.top};left:${drag.node.style.left};width:${drag.node.style.width};height:${drag.node.style.height || '0'}`;
  drag.node.parentNode.insertBefore(g, drag.node); drag.ghost = g;
  try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
}
function onDragMove(pe) {
  if (!drag || pe.pointerId !== drag.id) return;
  const dx = pe.clientX - drag.x0, dy = pe.clientY - drag.y0;
  if (!drag.active) {
    if (drag.touch) { if (Math.hypot(dx, dy) > 8) cleanupDrag(); return; } // finger moved first = scrolling
    if (Math.hypot(dx, dy) < 4) return;
    activateDrag();
  }
  pe.preventDefault();
  const dMin = Math.round(dy / curHour() * 60 / 15) * 15;
  const d = drag;
  if (d.mode === 'resize') {
    d.s = d.s0; d.e = Math.max(d.s0 + 15, Math.min(1440, d.e0 + dMin));
  } else {
    const dur = d.e0 - d.s0;
    d.s = Math.max(0, Math.min(1440 - Math.max(dur, 15), d.s0 + dMin)); d.e = d.s + dur;
    const col = colAt(pe.clientX);
    if (col && col.dataset.date !== d.date) { d.date = col.dataset.date; col.append(d.node); }
  }
  d.node.style.top = `calc(var(--hour) * ${d.s / 60}${d.isPoint ? '' : ' + 1px'})`;
  if (!d.isPoint) d.node.style.height = `max(calc(var(--hour) * ${(d.e - d.s) / 60} - 2px), 18px)`;
  const tm = d.node.querySelector(d.isPoint ? '.lb' : '.tm');
  if (tm) tm.textContent = d.isPoint ? `${d.ev.title} ${fromMin(d.s).replace(/^0/, '')}` : `${fromMin(d.s)}–${fromMin(Math.min(d.e, 1439))}`;
}
async function onDragEnd(pe) {
  if (!drag || pe.pointerId !== drag.id) return;
  const d = drag; cleanupDrag();
  if (d.ghost) d.ghost.remove();
  if (!d.active) return;
  snapIds.add(d.ev.id); setTimeout(() => snapIds.delete(d.ev.id), 400);
  justDragged = true; setTimeout(() => { justDragged = false; }, 50);
  d.node.classList.remove('dragging');
  const start = fromMin(d.s), end = d.isPoint ? start : fromMin(Math.min(d.e, 1439));
  const changed = d.date !== d.ev.date || start !== d.ev.start || end !== d.ev.end;
  if (changed) {
    try { await updateEvent(d.ev.id, { date: d.date, start, end }); toast(`已改到 ${d.date.slice(5).replace('-', '/')} ${start}${d.isPoint ? '' : '–' + end}`); }
    catch (err) { toast('没改成功：' + (err.message || err.code)); }
  }
  render();
}
function onDragCancel() { const d = drag; cleanupDrag(); if (d && d.ghost) d.ghost.remove(); if (d && d.active) render(); }
function cleanupDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);
  const pending = drag.pending;
  drag = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragCancel);
  if (pending) setTimeout(render, 0);
}
// while dragging with a finger, stop the page from scrolling
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });

/* ================= zoom ================= */
const ZMIN = 0.5, ZMAX = 2.4;
let zoom = (() => { const z = parseFloat(ls.get('cc_zoom')); return z >= ZMIN && z <= ZMAX ? z : 1; })();
const baseHour = () => window.innerWidth <= 700 ? 54 : 58;
const curHour = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 58;
function applyZoom(z, anchorY) {
  z = Math.max(ZMIN, Math.min(ZMAX, z));
  const sc = $('#scroller'), oldH = curHour(), newH = Math.round(baseHour() * z * 10) / 10;
  const headH = (document.querySelector('.dayhead') || {}).offsetHeight || 0;
  const y = anchorY == null ? sc.clientHeight / 2 : anchorY;
  const minute = (sc.scrollTop + y - headH) / oldH * 60;
  zoom = z;
  document.documentElement.style.setProperty('--hour', newH + 'px');
  sc.scrollTop = headH + minute / 60 * newH - y;
  clearTimeout(applyZoom.t);
  applyZoom.t = setTimeout(() => { ls.set('cc_zoom', String(zoom)); document.querySelectorAll('.ev').forEach(n => n.classList.toggle('short', n.offsetHeight < 34)); }, 150);
}
document.documentElement.style.setProperty('--hour', baseHour() * zoom + 'px');
window.addEventListener('resize', () => document.documentElement.style.setProperty('--hour', baseHour() * zoom + 'px'));
$('#zoomIn').onclick = () => applyZoom(zoom * 1.25);
$('#zoomOut').onclick = () => applyZoom(zoom / 1.25);
(() => {
  const sc = $('#scroller');
  // trackpad pinch / ctrl + wheel on computer
  sc.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const r = sc.getBoundingClientRect();
    applyZoom(zoom * Math.exp(-e.deltaY * 0.01), e.clientY - r.top);
  }, { passive: false });
  // two-finger pinch on phone
  let p0 = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  sc.addEventListener('touchstart', e => { if (e.touches.length === 2) { const r = sc.getBoundingClientRect(); p0 = { d: dist(e.touches), z: zoom, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top }; } }, { passive: true });
  sc.addEventListener('touchmove', e => { if (p0 && e.touches.length === 2) { e.preventDefault(); applyZoom(p0.z * dist(e.touches) / p0.d, p0.y); } }, { passive: false });
  sc.addEventListener('touchend', e => { if (e.touches.length < 2) p0 = null; });
  ['gesturestart', 'gesturechange'].forEach(n => sc.addEventListener(n, e => e.preventDefault(), { passive: false }));
})();

/* ================= voice input (browser speech recognition) ================= */
const defaultPh = () => window.innerWidth <= 700 ? '有什么新安排？' : '今天有什么新的安排';
input.placeholder = defaultPh();
let rec = null, vBase = '', vFinal = '', vPartial = '', stopByUser = false;
function showVoice() { input.value = (vBase + vFinal + vPartial).replace(/^\s+/, ''); autosize(); }
function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;                           // e.g. Firefox: keep typing (or use the keyboard's mic)
  const mic = $('#micBtn'); mic.style.display = '';
  mic.onclick = () => {
    if (rec) { stopByUser = true; try { rec.stop(); } catch (e) {} return; }
    try { rec = new SR(); } catch (e) { mic.style.display = 'none'; return; }
    rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = true;
    vBase = input.value ? input.value + ' ' : ''; vFinal = ''; vPartial = ''; stopByUser = false;
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) vFinal += r[0].transcript; else interim += r[0].transcript;
      }
      vPartial = interim; showVoice();
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('没有麦克风权限，可以在浏览器设置里打开，或者继续打字～');
      else if (e.error === 'no-speech') toast('没听到声音，再试一次？');
      else if (e.error !== 'aborted') toast('语音没听清，再试一次？');
    };
    rec.onend = () => {
      rec = null; mic.classList.remove('on'); input.placeholder = defaultPh();
      if (vPartial) { vFinal += vPartial; vPartial = ''; }
      showVoice();
      if (stopByUser && input.value.trim() && vFinal.trim()) send();
    };
    try { rec.start(); mic.classList.add('on'); input.placeholder = '在听呢，说完再按一下 🎙'; }
    catch (e) { rec = null; toast('麦克风打不开，可以继续打字～'); }
  };
}

/* ================= boot ================= */
render(); renderChat(); setupVoice();

function showLanding() {
  showOv('newOverlay');
  $('#openGo').onclick = () => {
    const v = $('#openLink').value.trim();
    const m = v.match(/[?&]c=([A-Za-z0-9_-]{16,48})/) || v.match(/^([A-Za-z0-9_-]{16,48})$/);
    if (!m) { toast('这个链接里找不到日历编号，要用 ⚙ 里复制的专属链接哦'); return; }
    ls.set('cc_last', m[1]);
    location.href = location.pathname + '?c=' + m[1];
  };
  $('#newGo').onclick = async () => {
    const a = $('#newA').value.trim(), b = $('#newB').value.trim();
    if (!a || !b) { toast('两个名字都写一下吧'); return; }
    $('#newGo').disabled = true; $('#newGo').textContent = '创建中…';
    try {
      const j = await api('calendar', 'POST', { nameA: a, nameB: b });
      ls.set('cc_last', j.id); ls.set('cc_me_' + j.id, 'a');
      location.href = location.pathname + '?c=' + j.id + '#new';
    } catch (e) { toast('没创建成功：' + e.message); $('#newGo').disabled = false; $('#newGo').textContent = '创建'; }
  };
}

(async () => {
  if (!CAL) { state.loading = false; render(); input.disabled = true; $('#send').disabled = true; showLanding(); return; }
  try {
    const j = await api('calendar?c=' + CAL);
    state.names = { a: j.calendar.nameA, b: j.calendar.nameB };
    SITE = j.siteUrl || null;
    document.title = `${state.names.a} & ${state.names.b} 的日历`;
    render(); renderChat();
  } catch (e) {
    if (e.status === 404 || e.status === 400) { ls.set('cc_last', ''); toast('找不到这本日历，链接可能不完整'); showLanding(); return; }
    toast('暂时连不上，稍后会自动重试');
  }
  if (!state.me) openWho();
  if (location.hash === '#new') { history.replaceState(null, '', location.pathname + location.search); setTimeout(() => toast('创建好啦！点右上角 ⚙ 复制链接发给 TA 💌'), 600); }
  await refresh();
  document.querySelectorAll('.skel').forEach(n => n.classList.add('out'));
  await new Promise(r => setTimeout(r, 220));
  state.loading = false; firstAppear = true; render(); firstAppear = false;
  setInterval(refresh, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('focus', refresh);
  try { assistantOn = !!(await api('assistant')).available; } catch (e) { assistantOn = false; }
  if (!assistantOn) {
    input.placeholder = '小助手暂不可用，点日历添加';
    input.disabled = true; $('#send').disabled = true; $('#micBtn').style.display = 'none';
  }
})();
</script>
